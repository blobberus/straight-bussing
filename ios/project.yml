# XcodeGen spec: `cd ios && xcodegen generate` writes StraightBussing.xcodeproj (never hand-edited, not committed).
# Bundle ids are PLACEHOLDERS until the Apple Developer account exists (see ios/README.md, App Store checklist).
name: StraightBussing
options:
  bundleIdPrefix: com.example.straightbussing
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
packages:
  StraightBussingKit:
    path: StraightBussingKit
targets:
  StraightBussing:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
      - path: Shared
      # The web app's static data, bundled at build time as the `data` folder (folder reference: no copy in git).
      - path: ../web/data
        type: folder
        buildPhase: resources
    dependencies:
      - package: StraightBussingKit
      - target: StraightBussingWidgets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Straight Bussing
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.navigation
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: "Shows the shuttle stops nearest to you and walking times. Your location is not stored or tracked; walking directions send only a rounded start point to Apple Maps."
        NSSupportsLiveActivities: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: straightbussing
            CFBundleURLSchemes: [straightbussing]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.straightbussing
        PRODUCT_NAME: StraightBussing
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
  StraightBussingWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    dependencies:
      - package: StraightBussingKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Straight Bussing
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.straightbussing.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  StraightBussingUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: StraightBussing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.straightbussing.uitests
        TEST_TARGET_NAME: StraightBussing
schemes:
  StraightBussing:
    build:
      targets:
        StraightBussing: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [StraightBussingUITests]

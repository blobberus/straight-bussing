name: Collect ground truth
# Hourly job: logs true bus arrivals for ~55 min and commits the CSV to the 'data' branch.
# Pages deploys only on pushes to main (pages.yml), so pushes to 'data' never trigger it.
on:
  schedule: [{ cron: "7 * * * *" }]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: collect, cancel-in-progress: false }
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4          # main: tools/ + web/data
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Prepare data branch worktree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch origin data
            git worktree add databranch -B data origin/data
          else
            git worktree add --orphan -b data databranch 2>/dev/null || { git worktree add --detach databranch && git -C databranch checkout --orphan data && git -C databranch rm -rf . >/dev/null 2>&1 || true; }
          fi
          mkdir -p databranch/data/ground_truth
      - name: Log arrivals
        run: python tools/truth_logger.py --duration 3300 --out databranch/data/ground_truth/arrivals.csv
      - name: Commit and push to data branch
        working-directory: databranch
        run: |
          git add data/ground_truth/arrivals.csv
          if git diff --cached --quiet; then echo "no new rows"; exit 0; fi
          git commit -m "data: arrivals $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            if git push origin data; then exit 0; fi
            git pull --rebase -X theirs origin data || git rebase --abort
            sleep 5
          done
          echo "push failed after 3 attempts"; exit 1

name: Collect ground truth
run-name: >-
  ${{ inputs.mode == 'sleep' && 'Collector idle: no buses running (checks the feed every 2 min)'
  || inputs.mode == 'collect' && 'Collect ground truth'
  || github.event_name == 'schedule' && 'Collect ground truth (backstop: collect or idle)'
  || 'Collect ground truth (manual: collect or idle)' }}
# Collection while buses run (since 2026-10-18, tools/service_gate.py): a run collects only while a bus reports
# live (and 30 min after the last report) or from 45 min before to 30 min after a scheduled route start; the
# rest of the time one idle run (mode sleep) logs nothing, reads the vehicle feed every 2 min (and the alerts
# every 10 min) and starts a collect run as soon as buses report, an alert changes or a start is near. The live
# feed decides, not the timetable: night routes stop reporting about 00:40 while the timetable says 4:29 AM.
# While collecting: each run logs 70 min and, 40 min in, starts its own successor
# (tools/collect_chain.py), so consecutive runs overlap by ~30 min and no start is ever missed.
# Why: GitHub fired only ~4 of the ~48 scheduled runs a day (2026-10-09), 30-40 min late. The :07/:37
# cron stays as a backstop that restarts the chain if it ever stops.
# Bounds (details in tools/collect_chain.py): two concurrency slots (a/b) mean GitHub never runs more than
# 2 collect runs at once; a run dispatches at most once, only while it is the only queued/in-progress
# collect run. Kill switches: repo variable COLLECT_CHAIN=off, or "Disable workflow" in the Actions tab.
# Each run writes only its own rows, then merges them into data/ground_truth/arrivals.csv on the orphan
# 'data' branch (tools/merge_arrivals.py drops the duplicates from the overlap; predictions.csv and the
# service alert versions in alerts.csv sit next to it) and refreshes web/data/learned.json there. Nothing is ever pushed to main, so this never triggers a Pages deploy.
# Docs: docs/DATA.md, monitoring.md
on:
  schedule:
    - cron: "7 * * * *"      # slot a
    - cron: "37 * * * *"     # slot b
  workflow_dispatch:
    inputs:
      slot:
        description: "Concurrency slot. Self-chained runs alternate a/b; a manual run can keep a."
        type: choice
        options: [a, b]
        default: a
      mode:
        description: "auto = collect if buses run or are about to, else hand over to an idle run; collect = log now; sleep = idle run"
        type: choice
        options: [auto, collect, sleep]
        default: auto
permissions:
  contents: write
  actions: write          # start the next run (self-chain) + keepalive (re-enable after GitHub's 60-day idle rule)
concurrency:              # one running run per slot: never more than 2 collect runs at once
  group: collect-${{ inputs.slot || (github.event.schedule == '37 * * * *' && 'b') || 'a' }}
  cancel-in-progress: false   # never cancel a collecting run (a newer waiting run replaces an older waiting one)
env:
  SLOT: ${{ inputs.slot || (github.event.schedule == '37 * * * *' && 'b') || 'a' }}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.mode == 'sleep' && 355 || 95 }}   # an idle run hands over at 5 h 40 min
    steps:
      - uses: actions/checkout@v4            # code (tools/ + web/data) always from main
        with: { ref: main }
      - name: Collect or idle (buses running or about to start?)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECT_CHAIN: ${{ vars.COLLECT_CHAIN }}
          MODE: ${{ inputs.mode || 'auto' }}
        run: |
          python3 tools/collect_chain.py gate --mode "$MODE" --slot "$SLOT" || {
            echo "::warning title=Collect gate failed::collecting to be safe"
            echo "mode=collect" >> "$GITHUB_OUTPUT"
          }
      - name: Idle until buses run (logs nothing; reads the feed every 2 min, starts a collect run when needed)
        if: steps.gate.outputs.mode == 'sleep'
        timeout-minutes: 352
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECT_CHAIN: ${{ vars.COLLECT_CHAIN }}
          MODE: ${{ inputs.mode || 'auto' }}
        run: |
          # an auto run (cron backstop, manual) that found no bus has the 95-min job limit: it hands over at 75 min
          LIMITS=""; [ "$MODE" = "sleep" ] || LIMITS="--until 4500 --hard 5100"
          python3 tools/collect_chain.py sleep --slot "$SLOT" $LIMITS
      - name: The idle run failed, so a collect run takes over (it idles again by itself if no bus runs)
        if: failure() && steps.gate.outputs.mode == 'sleep'
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECT_CHAIN: ${{ vars.COLLECT_CHAIN }}
        run: python3 tools/collect_chain.py watch --slot "$SLOT" --after 0 --until 900
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.mode == 'collect'
        with: { python-version: "3.11" }
      - name: Start the self-chain watcher (background; may start the next run 40 min from now)
        if: steps.gate.outputs.mode == 'collect'
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECT_CHAIN: ${{ vars.COLLECT_CHAIN }}
        run: |
          # --live / --logger-status: the next run collects or idles (service_gate), and starts at once if the
          # logger stops early (no bus for 30 min, or a crash)
          nohup python tools/collect_chain.py watch --slot "$SLOT" --state "$RUNNER_TEMP/chain.json" \
            --live "$RUNNER_TEMP/live.json" --logger-status "$RUNNER_TEMP/logger.json" \
            > "$RUNNER_TEMP/chain.log" 2>&1 < /dev/null &
          echo "slot $SLOT, watcher pid $!, COLLECT_CHAIN='${COLLECT_CHAIN}'"
      - name: Refresh static network data
        if: steps.gate.outputs.mode == 'collect'
        run: |
          python tools/build_gtfs.py || {
            echo "::warning title=GTFS refresh failed::using the committed web/data"
            git checkout -- web/data
          }
      - name: Seed from the shared CSV
        if: steps.gate.outputs.mode == 'collect'
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            # blob-less + shallow: only the one CSV below is downloaded, not the whole data branch
            git fetch --no-tags --depth 1 --filter=blob:none origin +refs/heads/data:refs/remotes/origin/data
            git show origin/data:data/ground_truth/arrivals.csv > "$RUNNER_TEMP/seed.csv" 2>/dev/null || : > "$RUNNER_TEMP/seed.csv"
          else
            : > "$RUNNER_TEMP/seed.csv"
          fi
      - name: Log arrivals (70 min, or until no bus has run for 30 min)
        id: log
        if: steps.gate.outputs.mode == 'collect'
        timeout-minutes: 75
        continue-on-error: true              # rows are flushed as they are found; keep what we have
        run: |
          date +%s > "$RUNNER_TEMP/log.t0"
          # --pred-out: Passio's prediction 1 to 30 min ahead of each arrival (predictions.csv, the owner's accuracy goal);
          # --pred-log: every prediction update Passio published (artifact below, for re-analysis);
          # --alerts-out: Passio's service alerts at start and every 5 min, one row per alert version (own thread,
          # never delays the 10 s loop; merged into data/ground_truth/alerts.csv below);
          # --stop-when-idle: stop once no bus has reported for 30 min and no route is about to start (service_gate.py)
          python tools/truth_logger.py --duration 4200 --seed "$RUNNER_TEMP/seed.csv" --out "$RUNNER_TEMP/run.csv" \
            --status-file "$RUNNER_TEMP/logger.json" --raw-out "$RUNNER_TEMP/raw/raw-polls.jsonl" \
            --pred-out "$RUNNER_TEMP/run_pred.csv" --pred-log "$RUNNER_TEMP/pred/pred-updates.jsonl" \
            --alerts-out "$RUNNER_TEMP/run_alerts.csv" --stop-when-idle --live-file "$RUNNER_TEMP/live.json"
      - name: Keep the raw position polls (RouteKnower E03; artifact, 90 days, never on the data branch)
        if: always() && steps.gate.outputs.mode == 'collect'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: raw-polls-${{ github.run_id }}
          path: ${{ runner.temp }}/raw/raw-polls.jsonl
          retention-days: 90
          if-no-files-found: ignore
      - name: Keep Passio's prediction updates (artifact, 90 days; re-score any lead or attribution rule later)
        if: always() && steps.gate.outputs.mode == 'collect'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pred-updates-${{ github.run_id }}
          path: ${{ runner.temp }}/pred/pred-updates.jsonl
          retention-days: 90
          if-no-files-found: ignore
      - name: Check the logging run (annotates problems; the job stays green so the merge always runs)
        if: always() && steps.gate.outputs.mode == 'collect'
        env: { OUTCOME: "${{ steps.log.outcome }}" }
        run: |
          python - "$RUNNER_TEMP" <<'EOF'
          import json, os, sys, time
          d = sys.argv[1]
          try:
              ran = (time.time() - int(open(f"{d}/log.t0").read())) / 60
          except (OSError, ValueError):
              ran = 0.0
          try:
              s = json.load(open(f"{d}/logger.json"))
          except (OSError, ValueError):
              s = None
          warn = []
          if os.environ.get("OUTCOME") != "success":
              warn.append(f"the logging step ended '{os.environ.get('OUTCOME')}'")
          idle = (s or {}).get("idle_stop")          # stopped on purpose: no bus ran for 30 min (service_gate.py)
          if ran < 65 and not idle:
              warn.append(f"logging stopped after {ran:.0f} of 70 min")
          if s is None:
              warn.append("the logger wrote no status file (crashed or killed)")
          else:
              if s.get("errors"):
                  warn.append(f"{s['errors']} processing error(s) were skipped; first: {s.get('first_error')}")
              if s.get("polls") and s.get("fetch_errors", 0) > 0.2 * 2 * s["polls"]:
                  warn.append(f"{s['fetch_errors']} of {2 * s['polls']} feed fetches failed (Passio outage?)")
          line = f"logger: {ran:.0f} min" + (f" (stopped early, no bus running: {idle})" if idle else "") + (f", {s['polls']} polls, {s['rows']} rows, {s['errors']} errors, "
                                             f"{s['fetch_errors']} failed fetches" if s else ", no status")
          alert_warn = []                    # service alerts: own counters, never part of the degraded verdict
          if s and "alert_polls" in s:
              ap = s.get("alert_polls") or 0
              af = (s.get("alert_fetch_errors") or 0) + (s.get("alert_errors") or 0)
              line += f"; alerts: {s.get('alert_versions') or 0} versions, {af} of {ap} polls failed"
              if ap == 0 or af > ap / 2:
                  alert_warn.append(f"service alerts: {af} of {ap} polls failed; last error: {s.get('alert_last_error')}")
          print(line)
          esc = lambda m: m.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          for w in warn:
              print(f"::warning title=Collector run degraded::{esc(w)} (rows found so far are still merged)")
          for w in alert_warn:
              print(f"::warning title=Service alerts not collected::{esc(w)} (arrivals are not affected)")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(f"**{line}**\n\n" + "".join(f"- warning: {w}\n" for w in warn + alert_warn) + "\n")
          EOF
      - name: Merge into the data branch and push
        if: always() && steps.gate.outputs.mode == 'collect'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -s "$RUNNER_TEMP/run.csv" ] || { echo "no rows this run"; exit 0; }
          for i in 1 2 3 4 5; do
            rm -rf databranch; git worktree prune
            if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
              # blob-less, shallow fetch + sparse worktree: only what this job reads or writes is downloaded
              # (data/ground_truth/ incl. archive/ for merge_arrivals.py, web/data/ for learned.json, top-level
              # README.md); data/context/ (~30 MB of weather/traffic CSVs) stays on the server, untouched.
              git fetch --no-tags --depth 1 --filter=blob:none origin +refs/heads/data:refs/remotes/origin/data
              git worktree add --no-checkout -f -B data databranch origin/data
              git -C databranch sparse-checkout set --cone data/ground_truth web/data
              git -C databranch reset -q --hard
            else
              git worktree add --orphan -b data databranch 2>/dev/null || {
                git worktree add --detach databranch
                git -C databranch checkout --orphan data
                git -C databranch rm -rfq . || true
              }
              printf '# data branch\nAutomated ground-truth data. See docs/DATA.md on main.\n' > databranch/README.md
            fi
            python tools/merge_arrivals.py --into databranch/data/ground_truth/arrivals.csv --add "$RUNNER_TEMP/run.csv" --rotate-mb 40
            if [ -s "$RUNNER_TEMP/run_pred.csv" ]; then
              python tools/merge_predictions.py --into databranch/data/ground_truth/predictions.csv \
                --add "$RUNNER_TEMP/run_pred.csv" --rotate-mb 40
            fi
            if [ -s "$RUNNER_TEMP/run_alerts.csv" ]; then
              # one row per alert version (min first_seen, max last_seen); a failure never stops the arrivals push
              python tools/merge_alerts.py --into databranch/data/ground_truth/alerts.csv \
                --add "$RUNNER_TEMP/run_alerts.csv" || echo "::warning title=Alerts merge failed::arrivals are still committed"
            fi
            python tools/refresh_model.py --data databranch/data/ground_truth/arrivals.csv \
              --out databranch/web/data/learned.json || echo "refresh_model failed; arrivals are still committed"
            git -C databranch add -A data README.md 2>/dev/null || git -C databranch add -A data
            [ -f databranch/web/data/learned.json ] && git -C databranch add web/data/learned.json
            if git -C databranch diff --cached --quiet; then echo "nothing new (all duplicates)"; exit 0; fi
            git -C databranch commit -qm "data: arrivals $(date -u +%Y-%m-%dT%H:%MZ)"
            if git -C databranch push origin HEAD:refs/heads/data; then exit 0; fi
            echo "push rejected (attempt $i): another run pushed first; re-merging on top of it"
            sleep $((RANDOM % 20 + 5 * i))
          done
          echo "push failed after 5 attempts"; exit 1
      - name: Keep the schedule alive (unless someone disabled the workflow by hand)
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          api="https://api.github.com/repos/${{ github.repository }}/actions/workflows/collect.yml"
          state=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$api" \
            | python -c "import json, sys; print(json.load(sys.stdin).get('state', ''))" || echo unknown)
          if [ "$state" = "disabled_manually" ]; then echo "workflow was disabled by hand: leaving it off"; exit 0; fi
          curl -fsS -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$api/enable" || echo "keepalive call failed (harmless)"
      - name: Self-chain result (waits only while this run still has to start the next one)
        if: always() && steps.gate.outputs.mode == 'collect'
        timeout-minutes: 90                  # the wait itself ends at the watcher's deadline (85 min after start)
        run: |
          python tools/collect_chain.py wait --state "$RUNNER_TEMP/chain.json"
          echo "--- watcher log"; cat "$RUNNER_TEMP/chain.log" 2>/dev/null || true

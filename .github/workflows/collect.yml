name: Collect ground truth
# Constant collection. Each run logs 70 min and, 40 min in, starts its own successor
# (tools/collect_chain.py), so consecutive runs overlap by ~30 min and no start is ever missed.
# Why: GitHub fired only ~4 of the ~48 scheduled runs a day (2026-10-09), 30-40 min late. The :07/:37
# cron stays as a backstop that restarts the chain if it ever stops.
# Bounds (details in tools/collect_chain.py): two concurrency slots (a/b) mean GitHub never runs more than
# 2 collect runs at once; a run dispatches at most once, only while it is the only queued/in-progress
# collect run. Kill switches: repo variable COLLECT_CHAIN=off, or "Disable workflow" in the Actions tab.
# Each run writes only its own rows, then merges them into data/ground_truth/arrivals.csv on the orphan
# 'data' branch (tools/merge_arrivals.py drops the duplicates from the overlap) and refreshes
# web/data/learned.json there. Nothing is ever pushed to main, so this never triggers a Pages deploy.
# Docs: docs/DATA.md, monitoring.md
on:
  schedule:
    - cron: "7 * * * *"      # slot a
    - cron: "37 * * * *"     # slot b
  workflow_dispatch:
    inputs:
      slot:
        description: "Concurrency slot. Self-chained runs alternate a/b; a manual run can keep a."
        type: choice
        options: [a, b]
        default: a
permissions:
  contents: write
  actions: write          # start the next run (self-chain) + keepalive (re-enable after GitHub's 60-day idle rule)
concurrency:              # one running run per slot: never more than 2 collect runs at once
  group: collect-${{ inputs.slot || (github.event.schedule == '37 * * * *' && 'b') || 'a' }}
  cancel-in-progress: false   # never cancel a collecting run (a newer waiting run replaces an older waiting one)
env:
  SLOT: ${{ inputs.slot || (github.event.schedule == '37 * * * *' && 'b') || 'a' }}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4            # code (tools/ + web/data) always from main
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Start the self-chain watcher (background; may start the next run 40 min from now)
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECT_CHAIN: ${{ vars.COLLECT_CHAIN }}
        run: |
          nohup python tools/collect_chain.py watch --slot "$SLOT" --state "$RUNNER_TEMP/chain.json" \
            > "$RUNNER_TEMP/chain.log" 2>&1 < /dev/null &
          echo "slot $SLOT, watcher pid $!, COLLECT_CHAIN='${COLLECT_CHAIN}'"
      - name: Refresh static network data
        run: |
          python tools/build_gtfs.py || {
            echo "::warning title=GTFS refresh failed::using the committed web/data"
            git checkout -- web/data
          }
      - name: Seed from the shared CSV
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            # blob-less + shallow: only the one CSV below is downloaded, not the whole data branch
            git fetch --no-tags --depth 1 --filter=blob:none origin +refs/heads/data:refs/remotes/origin/data
            git show origin/data:data/ground_truth/arrivals.csv > "$RUNNER_TEMP/seed.csv" 2>/dev/null || : > "$RUNNER_TEMP/seed.csv"
          else
            : > "$RUNNER_TEMP/seed.csv"
          fi
      - name: Log arrivals (70 min)
        id: log
        timeout-minutes: 75
        continue-on-error: true              # rows are flushed as they are found; keep what we have
        run: |
          date +%s > "$RUNNER_TEMP/log.t0"
          python tools/truth_logger.py --duration 4200 --seed "$RUNNER_TEMP/seed.csv" --out "$RUNNER_TEMP/run.csv" \
            --status-file "$RUNNER_TEMP/logger.json"
      - name: Check the logging run (annotates problems; the job stays green so the merge always runs)
        if: always()
        env: { OUTCOME: "${{ steps.log.outcome }}" }
        run: |
          python - "$RUNNER_TEMP" <<'EOF'
          import json, os, sys, time
          d = sys.argv[1]
          try:
              ran = (time.time() - int(open(f"{d}/log.t0").read())) / 60
          except (OSError, ValueError):
              ran = 0.0
          try:
              s = json.load(open(f"{d}/logger.json"))
          except (OSError, ValueError):
              s = None
          warn = []
          if os.environ.get("OUTCOME") != "success":
              warn.append(f"the logging step ended '{os.environ.get('OUTCOME')}'")
          if ran < 65:
              warn.append(f"logging stopped after {ran:.0f} of 70 min")
          if s is None:
              warn.append("the logger wrote no status file (crashed or killed)")
          else:
              if s.get("errors"):
                  warn.append(f"{s['errors']} processing error(s) were skipped; first: {s.get('first_error')}")
              if s.get("polls") and s.get("fetch_errors", 0) > 0.2 * 2 * s["polls"]:
                  warn.append(f"{s['fetch_errors']} of {2 * s['polls']} feed fetches failed (Passio outage?)")
          line = f"logger: {ran:.0f} min" + (f", {s['polls']} polls, {s['rows']} rows, {s['errors']} errors, "
                                             f"{s['fetch_errors']} failed fetches" if s else ", no status")
          print(line)
          esc = lambda m: m.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          for w in warn:
              print(f"::warning title=Collector run degraded::{esc(w)} (rows found so far are still merged)")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(f"**{line}**\n\n" + "".join(f"- warning: {w}\n" for w in warn) + "\n")
          EOF
      - name: Merge into the data branch and push
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -s "$RUNNER_TEMP/run.csv" ] || { echo "no rows this run"; exit 0; }
          for i in 1 2 3 4 5; do
            rm -rf databranch; git worktree prune
            if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
              # blob-less, shallow fetch + sparse worktree: only what this job reads or writes is downloaded
              # (data/ground_truth/ incl. archive/ for merge_arrivals.py, web/data/ for learned.json, top-level
              # README.md); data/context/ (~30 MB of weather/traffic CSVs) stays on the server, untouched.
              git fetch --no-tags --depth 1 --filter=blob:none origin +refs/heads/data:refs/remotes/origin/data
              git worktree add --no-checkout -f -B data databranch origin/data
              git -C databranch sparse-checkout set --cone data/ground_truth web/data
              git -C databranch reset -q --hard
            else
              git worktree add --orphan -b data databranch 2>/dev/null || {
                git worktree add --detach databranch
                git -C databranch checkout --orphan data
                git -C databranch rm -rfq . || true
              }
              printf '# data branch\nAutomated ground-truth data. See docs/DATA.md on main.\n' > databranch/README.md
            fi
            python tools/merge_arrivals.py --into databranch/data/ground_truth/arrivals.csv --add "$RUNNER_TEMP/run.csv" --rotate-mb 40
            python tools/refresh_model.py --data databranch/data/ground_truth/arrivals.csv \
              --out databranch/web/data/learned.json || echo "refresh_model failed; arrivals are still committed"
            git -C databranch add -A data README.md 2>/dev/null || git -C databranch add -A data
            [ -f databranch/web/data/learned.json ] && git -C databranch add web/data/learned.json
            if git -C databranch diff --cached --quiet; then echo "nothing new (all duplicates)"; exit 0; fi
            git -C databranch commit -qm "data: arrivals $(date -u +%Y-%m-%dT%H:%MZ)"
            if git -C databranch push origin HEAD:refs/heads/data; then exit 0; fi
            echo "push rejected (attempt $i): another run pushed first; re-merging on top of it"
            sleep $((RANDOM % 20 + 5 * i))
          done
          echo "push failed after 5 attempts"; exit 1
      - name: Keep the schedule alive (unless someone disabled the workflow by hand)
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          api="https://api.github.com/repos/${{ github.repository }}/actions/workflows/collect.yml"
          state=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$api" \
            | python -c "import json, sys; print(json.load(sys.stdin).get('state', ''))" || echo unknown)
          if [ "$state" = "disabled_manually" ]; then echo "workflow was disabled by hand: leaving it off"; exit 0; fi
          curl -fsS -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$api/enable" || echo "keepalive call failed (harmless)"
      - name: Self-chain result (waits only while this run still has to start the next one)
        if: always()
        timeout-minutes: 90                  # the wait itself ends at the watcher's deadline (85 min after start)
        run: |
          python tools/collect_chain.py wait --state "$RUNNER_TEMP/chain.json"
          echo "--- watcher log"; cat "$RUNNER_TEMP/chain.log" 2>/dev/null || true

name: Deploy site
on:
  push: { branches: [main] }
  schedule: [{ cron: "17 9 * * *" }]   # daily: refresh schedule data
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python tools/build_gtfs.py
      - name: Refresh campus places (OpenStreetMap; daily run only, keeps the committed copy on failure)
        if: github.event_name == 'schedule'
        run: python tools/build_places.py || echo "places refresh failed; using committed web/data/places.json"
      - name: Assemble site (web/ without tests)
        run: |
          rm -rf _site
          cp -r web _site
          rm -rf _site/tests
          test -f _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: d
        uses: actions/deploy-pages@v4

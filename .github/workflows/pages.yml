name: Deploy site
on:
  push:
    branches: [main]
    # ios/ changes deploy through ios.yml (it re-dispatches this workflow after its simulator preview);
    # docs and top-level notes are not part of the site
    paths-ignore: ["ios/**", "docs/**", "*.md"]
  schedule: [{ cron: "17 9 * * *" }]   # daily: refresh schedule data
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Refresh schedule data (Passio GTFS; keeps the committed web/data on failure)
        run: |
          python tools/build_gtfs.py || {
            echo "::warning title=GTFS refresh failed::deploying the committed web/data/*.json"
            git checkout -- web/data
          }
      - name: Refresh campus places (OpenStreetMap; daily run only, keeps the committed copy on failure)
        if: github.event_name == 'schedule'
        run: python tools/build_places.py || echo "places refresh failed; using committed web/data/places.json"
      - name: Assemble site (web/ without tests)
        run: |
          rm -rf _site
          cp -r web _site
          rm -rf _site/tests
          test -f _site/index.html
      - name: Add the iPhone app simulator preview under /ios/ (ios-preview branch, built by ios.yml; skipped if missing)
        run: |
          if git fetch -q --depth 1 origin ios-preview 2>/dev/null; then
            mkdir -p _site/ios && git archive FETCH_HEAD | tar -x -C _site/ios && echo "added $(ls _site/ios | wc -l) files to _site/ios"
          else
            echo "no ios-preview branch: deploying the web app only"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: d
        uses: actions/deploy-pages@v4

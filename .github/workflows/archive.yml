name: Archive prediction data
# Daily, after the Chicago service day ends (04:00): the 90-day CI artifacts of collect.yml (pred-updates-<run>,
# raw-polls-<run>) become one gzipped file per service day, plus the forecast-snapshot table for the 10% rule
# (tools/build_eta_dataset.py), uploaded to the GitHub Release data-archive-YYYY-MM (assets do not grow the git
# history; about 5.5 MB a day, plus the GTFS zip used). The day's aggregate pass rates go to data/eta/summary.csv on the data branch.
# Catches up the last 10 days, so a dropped scheduled run costs nothing. Code: tools/archive_day.py.
on:
  schedule: [{ cron: "41 10 * * *" }]   # about 5:41 AM CDT / 4:41 AM CST, after the 04:00 end of the service day
  workflow_dispatch:
    inputs:
      day: { description: "Service day YYYY-MM-DD (blank: catch up the last 10 days)", required: false, default: "" }
      replace: { description: "Rebuild and overwrite an archived day", type: boolean, default: false }
permissions:
  contents: write                       # release assets + the data branch summary
  actions: read                         # download collect.yml artifacts
concurrency: { group: data-archive, cancel-in-progress: false }
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Offline tests
        run: python tools/test_eta.py
      - name: Inputs (GTFS timetable, data branch)
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gtfs.zip" \
            https://passio3.com/chicago/passioTransit/gtfs/google_transit.zip \
            || { echo "::warning title=GTFS download failed::timetable columns stay blank"; rm -f "$RUNNER_TEMP/gtfs.zip"; }
          git fetch --no-tags --depth 1 --filter=blob:none origin +refs/heads/data:refs/remotes/origin/data
          git worktree add --no-checkout -f -B data databranch origin/data
          git -C databranch sparse-checkout set --cone data/ground_truth data/eta
          git -C databranch reset -q --hard
      - name: Archive finished service days
        env:
          GH_TOKEN: ${{ github.token }}
          DAY: ${{ inputs.day }}
          REPLACE: ${{ inputs.replace }}
        run: |
          args=(--catch-up 10 --work "$RUNNER_TEMP/work" --arrivals databranch/data/ground_truth/arrivals.csv)
          for f in databranch/data/ground_truth/archive/arrivals-*.csv; do [ -f "$f" ] && args+=("$f"); done
          [ -f "$RUNNER_TEMP/gtfs.zip" ] && args+=(--gtfs "$RUNNER_TEMP/gtfs.zip")
          # service alert versions of the day (alerts-<day>.csv.gz; optional, skipped if the file is missing)
          args+=(--alerts databranch/data/ground_truth/alerts.csv)
          [ -n "$DAY" ] && args+=(--day "$DAY")
          [ "$REPLACE" = "true" ] && args+=(--replace)
          python tools/archive_day.py "${args[@]}"
      - name: Merge the daily summary into the data branch
        if: always()
        run: |
          ls "$RUNNER_TEMP"/work/summary-*.csv >/dev/null 2>&1 || { echo "no new summary rows"; exit 0; }
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            rm -rf databranch; git worktree prune
            git fetch --no-tags --depth 1 --filter=blob:none origin +refs/heads/data:refs/remotes/origin/data
            git worktree add --no-checkout -f -B data databranch origin/data
            git -C databranch sparse-checkout set --cone data/eta
            git -C databranch reset -q --hard
            python tools/archive_day.py --merge-summary "$RUNNER_TEMP"/work/summary-*.csv --data-dir databranch
            git -C databranch add -A data/eta
            if git -C databranch diff --cached --quiet; then echo "nothing new"; exit 0; fi
            git -C databranch commit -qm "data: eta summary $(date -u +%Y-%m-%dT%H:%MZ)"
            if git -C databranch push origin HEAD:refs/heads/data; then exit 0; fi
            echo "push rejected (attempt $i): a collector run pushed first; retrying on top of it"
            sleep $((RANDOM % 20 + 5 * i))
          done
          echo "push failed after 5 attempts"; exit 1

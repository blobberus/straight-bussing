<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Straight Bussing</title>
<meta name="description" content="Unofficial live campus shuttle tracker. Times are estimates; not affiliated with the University.">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Straight Bussing">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="css/tokens.css?v=4">
<link rel="stylesheet" href="css/base.css?v=4">
<link rel="stylesheet" href="css/sheet.css?v=4">
<link rel="stylesheet" href="css/components.css?v=4">
<link rel="stylesheet" href="css/map.css?v=4">
<link rel="stylesheet" href="css/views.css?v=4">
<link rel="stylesheet" href="css/routes.css?v=4">
<link rel="stylesheet" href="css/route.css?v=4">
<link rel="stylesheet" href="css/myroutes.css?v=4">
<link rel="stylesheet" href="css/journey.css?v=4">
<link rel="stylesheet" href="css/trip.css?v=4">
<link rel="stylesheet" href="css/settings.css?v=4">
</head>
<body>
<!-- #app is a plain wrapper on phones; on desktop/tablet css/base.css turns it into a 393x852 iPhone frame (js/ui/frame.js scales it) -->
<div id="app" class="app">
<div id="map" role="region" aria-label="Shuttle map"></div>

<!-- Google-Maps-style floating search bar: tap to plan a trip (Directions, destination focused); settings at its right end -->
<div id="topbar" class="topbar">
  <div class="searchbar">
    <button id="searchBar" class="searchbar-btn" type="button" data-action="dir:open" data-focus="to" aria-label="Search for a destination">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <span class="searchbar-text">Search for a destination</span>
    </button>
    <button id="settingsBtn" class="searchbar-gear" type="button" data-action="settings:open" aria-label="Settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
</div>

<button id="locateBtn" class="fab" type="button" aria-label="Show my location">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg>
</button>

<div id="pill" class="statuspill" role="status" aria-live="polite" hidden><span id="pillText" class="pilltext"></span><button id="pillRetry" class="pillbtn" type="button" data-action="retry" hidden>Retry</button></div>
<div id="ctxbar" class="ctxbar" role="status" aria-live="polite" hidden></div>

<section id="sheet" class="sheet" data-detent="half" role="dialog" aria-modal="false" aria-labelledby="title">
  <header id="sheetHead" class="sheet-head">
    <button id="grab" class="grab" type="button" aria-label="Resize panel" aria-expanded="true" aria-controls="content"></button>
    <div class="titleline">
      <button id="back" class="back" type="button" aria-label="Back" hidden>
        <svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10 2L2 10l8 8"/></svg>
      </button>
      <h1 id="title" class="sheet-title" tabindex="-1">Current trip</h1>
      <span id="titleRight" class="titleright"></span>
    </div>
  </header>
  <div id="content" class="sheet-content" tabindex="-1">
    <div class="skels" aria-busy="true"><span class="sr">Loading</span><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  </div>
</section>

<!-- bottom navigation (Google-Maps-style): the three sections; id stays "tabs" for the router -->
<nav id="tabs" class="bottomnav" aria-label="Sections">
  <button type="button" data-tab="nearby" aria-current="page"><span class="bn-ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg></span><span class="bn-label">Current trip</span></button>
  <button type="button" data-tab="routes"><span class="bn-ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h8.5a3.5 3.5 0 0 0 0-7h-9a3.5 3.5 0 0 1 0-7H16"/></svg></span><span class="bn-label">Routes</span></button>
  <button type="button" data-tab="myroutes" id="myRoutesTab"><span class="bn-ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></span><span class="bn-label">My Routes</span></button>
</nav>

<div id="dlg" class="scrim" hidden></div>
<div id="toast" class="toast hide" role="status" aria-live="polite" aria-atomic="true"></div>
</div>

<noscript><p style="position:fixed;inset:auto 0 0;padding:16px;background:#fff;color:#111">Straight Bussing needs JavaScript. Official service: 773.702.8181.</p></noscript>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script>
<script type="module" src="js/main.js?v=4"></script>
</body>
</html>

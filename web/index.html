<body>
<!-- #app is a plain wrapper on phones; on desktop/tablet css/base.css turns it into a 393x852 iPhone frame (js/ui/frame.js scales it) -->
<div id="app" class="app">
<!-- top rows (docs/DESIGN-SPEC-GLASS.md 3): Row A = the status banner (#pill, opaque, its Retry / See alert slot on the
     LEADING edge, owner 2026-11-03), Row B = the simulated-buses chip (#pill in its chip form) and the Settings circle
     with the feedback circle under it, the trip chip (#ctxbar) beside Settings or under the chip. Positions: css/base.css from --search-top and --pill-h. -->
<div id="pill" class="statuspill" role="status" aria-live="polite" hidden><button id="pillRetry" class="pillbtn pillslot" type="button" data-action="retry" hidden>Retry</button><button id="pillAlert" class="pillbtn pillslot" type="button" data-action="alerts:open" aria-label="Read the service alert" hidden>See alert</button><span id="pillIcon" class="pillicon" aria-hidden="true"></span><span id="pillText" class="pilltext"></span></div>
<div id="topbar" class="topbar">
  <button id="settingsBtn" class="glass gcircle gpress" type="button" data-action="settings:open" aria-label="Settings">
      <svg class="ic" width="20" height="20" stroke-width="2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
  </button>
  <!-- the beta feedback button under Settings (glass spec 4, 8.5; owner 2026-11-04 Q7: yes): js/ui/feedback-button.js
       shows it until the rider gives feedback or taps "I already gave feedback" -->
  <button id="feedbackBtn" class="glass gpress fbfab" type="button" aria-label="Give feedback" aria-haspopup="dialog" aria-expanded="false" hidden>
    <svg class="ic" width="20" height="20" stroke-width="2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <span class="fbfab-dot" aria-hidden="true"></span>
  </button>
</div>
<div id="ctxbar" class="ctxbar glass" role="status" aria-live="polite" hidden></div>

<section id="sheet" class="sheet" data-detent="peek" role="dialog" aria-modal="false" aria-labelledby="title">
  <!-- glass spec 8.8: the collapsed card's glass plate and the opaque sheet that fades in over it (ui/sheet.js) -->
  <div class="sheet-bg" aria-hidden="true"><div class="sheet-glass glass glass--moves"></div><div class="sheet-solid"></div></div>
  <header id="sheetHead" class="sheet-head">
    <div id="grab" class="grab" role="slider" tabindex="0" aria-label="Resize panel" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="2" aria-valuenow="1" aria-valuetext="Half" aria-controls="content"></div>
    <div class="titleline">
      <button id="back" class="back" type="button" aria-label="Back" hidden>
        <svg class="ic" width="22" height="22" stroke-width="2.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="titletext"><h1 id="title" class="sheet-title" tabindex="-1">Current trip</h1><p id="subtitle" class="sheet-sub"></p></div>
      <span id="titleRight" class="titleright"></span>
    </div>
  </header>
  <div id="content" class="sheet-content" tabindex="-1">
    <div class="skels" aria-busy="true"><span class="sr">Loading</span><div class="skel" aria-hidden="true"><span class="skel-chip"></span><span class="skel-lines"><span></span><span></span></span><span class="skel-eta"></span></div><div class="skel" aria-hidden="true"><span class="skel-chip"></span><span class="skel-lines"><span></span><span></span></span><span class="skel-eta"></span></div><div class="skel" aria-hidden="true"><span class="skel-chip"></span><span class="skel-lines"><span></span><span></span></span><span class="skel-eta"></span></div></div>
  </div>
  <!-- the lower-right group (glass spec 8.4): Lines by Time over Locate, riding 8 above the card's top edge -->
  <div id="mapctl" class="mapctl glass glass--moves" role="group" aria-label="Map controls">
    <button id="timeBtn" class="mapctl-btn" type="button" data-action="time:open" aria-label="Lines by Time" aria-haspopup="dialog" aria-expanded="false">
      <svg class="ic" width="20" height="20" stroke-width="2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
    </button>
    <span class="mapctl-sep" aria-hidden="true"></span>
    <button id="locateBtn" class="mapctl-btn" type="button" aria-label="Show my location">
      <svg class="ic ic-off" width="20" height="20" stroke-width="2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 11 22 2l-9 19-2-8z"/></svg><svg class="ic ic-on" width="20" height="20" stroke-width="2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 11 22 2l-9 19-2-8z" fill="currentColor"/></svg>
    </button>
  </div>
</section>

<!-- bottom row (glass spec 8.6, 8.7): the three sections as a floating glass capsule (the selection capsule behind the
     selected item; id "tabs" stays for the router) and the search circle at its trailing end (it opens Directions with
     the destination focused) -->
<div id="bottomrow" class="bottomrow">
<nav id="tabs" class="tabcap glass" aria-label="Sections">
  <span class="tab-pill" aria-hidden="true"></span>
  <button type="button" data-tab="nearby" aria-current="page"><span class="bn-ic"><svg class="ic ic-off" width="24" height="24" stroke-width="2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 6 2 7"/><path d="M10 6h4"/><path d="m22 7-2-1"/><rect width="16" height="16" x="4" y="3" rx="2"/><path d="M4 11h16"/><path d="M8 15h.01"/><path d="M16 15h.01"/><path d="M6 19v2"/><path d="M18 21v-2"/></svg><svg class="ic ic-on" width="24" height="24" stroke-width="2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 6 2 7"/><path d="m22 7-2-1"/><path d="M6 19v2"/><path d="M18 21v-2"/><path fill="currentColor" fill-rule="evenodd" stroke-width="1" d="M6 3h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm1.2 3a.7.7 0 0 0-.7.7V10h11V6.7a.7.7 0 0 0-.7-.7zM8 13.6a1.4 1.4 0 1 0 0 2.8 1.4 1.4 0 0 0 0-2.8zm8 0a1.4 1.4 0 1 0 0 2.8 1.4 1.4 0 0 0 0-2.8z"/></svg></span><span class="bn-label">Current trip</span></button>
  <button type="button" data-tab="routes"><span class="bn-ic"><svg class="ic ic-off" width="24" height="24" stroke-width="2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/></svg><svg class="ic ic-on" width="24" height="24" stroke-width="2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="6" cy="19" r="3" fill="currentColor"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3" fill="currentColor"/></svg></span><span class="bn-label">Routes</span></button>
  <button type="button" data-tab="myroutes" id="myRoutesTab"><span class="bn-ic"><svg class="ic ic-off" width="24" height="24" stroke-width="2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg><svg class="ic ic-on" width="24" height="24" stroke-width="2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z" fill="currentColor"/></svg></span><span class="bn-label">My Routes</span></button>
</nav>
<button id="searchBar" class="glass searchcircle gpress" type="button" data-action="dir:open" data-focus="to" aria-label="Search for a destination">
  <svg class="ic" width="22" height="22" stroke-width="2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
</button>
</div>

<!-- the map: drawn behind everything (fixed, --z-map), last in the DOM so the focus and screen-reader order is the
     glass spec 11 order (status banner, Row B, trip chip, sheet, lower-right group, tab bar, search), then the map and
     its credit links -->
<div id="map" role="region" aria-label="Shuttle map"></div>

<div id="dlg" class="scrim" hidden></div>
<div id="toast" class="toast hide" role="status" aria-live="polite" aria-atomic="true"></div>
</div>

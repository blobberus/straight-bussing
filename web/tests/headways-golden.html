     answers of web/js/core/schedule.js departures / hourlyHeadways / headwayLine (12-hour clockMin) on hand-made cases
     and on every distinct day of data/service.json. The web test route-schedule.js and the iOS Kit HeadwayTests (a copy

     python -m http.server in web/, copy the JSON in the page to both files. -->
<pre id="result">running...</pre>
<script type="module">
import { departures, hourlyHeadways, headwayLine } from "../js/core/schedule.js";
const CTA47 = [243,25,25,12,10,10,9,9,10,8,10,8,7,6,9,9,8,10,10,10,10,10,9,9,10,10,10,10,5,5,6,4,10,10,10,10,10,8,10,10,10,10,9,10,10,9,9,10,10,10,10,9,9,10,10,10,8,10,10,7,9,9,9,8,9,9,10,10,10,10,10,10,10,10,10,10,10,10,10,10,10,10,8,2,10,10,10,10,10,10,10,10,10,10,7,3,10,10,10,10,10,10,10,6,4,10,10,10,5,11,18,3,14,5,15,20,22,21,23,21,26,22,23,22];
const every = (from, gap, n) => Array.from({ length: n }, (_, i) => from + gap * i);
const red = [390, 397];
for (let t = 413; t <= 657; t += 20) red.push(t, t + 4);
const hand = [
  ["constant every 30", every(420, 30, 7)],
  ["hourly is not a break", every(1080, 60, 7)],
  ["15 then 10 min to 12:30 AM", [...every(600, 15, 20), ...every(900, 10, 58)]],
  ["53rd pattern with a lone last trip", departures({ dep: [420, 30, 30, ...Array(10).fill(15), ...Array(15).fill(30), 60] })],
  ["lone odd gap between steady runs", [...every(420, 15, 5), 502, ...every(532, 30, 4)]],
  ["lone gap within a minute joins", [...every(420, 10, 6), 481, ...every(511, 30, 4)]],
  ["timetable rounding stays one run", [420, 429, 439, 448, 458, 468, 479, 489, 500]],
  ["bunched pairs about every 10", red],
  ["17.3 min average", [600, 612, 632, 652]],
  ["hour by hour", [600, 612, 632, 652, 664, 684, 704]],
  ["4.5 min average", [600, 603, 609, 612, 618, 621, 627]],
  ["3 min average", [600, 602, 606, 608, 612, 614, 618]],
  ["slower second hour", [600, 604, 620, 624, 640, 644, 660, 690, 722, 750, 782]],
  ["one trip", [1380]],
  ["two trips", [1380, 1420]],
  ["two trips across noon", [690, 760]],
  ["three even", [1380, 1410, 1440]],
  ["three uneven", [1380, 1420, 1445]],
  ["break between stretches", [...every(341, 10, 26), ...every(941, 10, 19)]],
  ["89 min is one stretch", [600, 689]],
  ["90 min is a break", [600, 690]],
  ["a lone first bus", [360, ...every(397, 20, 6)]],
  ["after midnight", every(1410, 30, 4)],
  ["duplicates count once", [600, 610, 610, 620, 630]],
  ["junk skipped", [450, 420, 480, 480, 510, -3]],
  ["empty", []],
  ["18.3 min average", [600, 615, 635, 655]],
  ["tidy: bunched then steady 10", [600, 604, 620, 624, 640, 644, ...every(660, 10, 11)]],
  ["tidy: odd gap between two steady 10s", [...every(420, 10, 10), ...every(517, 10, 10)]],
  ["tidy: hole of twice the pace", [...every(420, 10, 10), ...every(530, 10, 10)]],
  ["tidy: uneven 12 next to steady 10", [600, 606, 624, 630, 648, 654, ...every(672, 10, 8)]],
  ["tidy: steady 10 then 13 stay apart", [...every(600, 10, 7), ...every(673, 13, 7)]],
  ["tidy: a 20 min burst joins", [...every(600, 10, 7), 665, 670, 675, 680, ...every(690, 10, 10)]],
  ["tidy: at most 6 lines", (() => { const a = []; let t = 300; for (let k = 0; k < 8; k++) { const gap = k % 2 ? 30 : 10; for (let i = 0; i < (k % 2 ? 4 : 10); i++) { a.push(t); t += gap; } } a.push(t); return a; })()],
];
const cases = hand.map(([name, deps]) => ({ name, deps }));
const svc = await (await fetch("../data/service.json", { cache: "no-store" })).json();
// a CTA day (experimental repo's web/data/cta/service.json, route 47 weekdays): the tidy rules on a long, noisy timetable
cases.push({ name: "cta:47 mon (experimental)", dep: CTA47, deps: departures({ dep: CTA47 }) });
const seen = new Set();
for (const [rid, r] of Object.entries(svc.routes)) {
  for (const [k, day] of Object.entries(r.days)) {
    if (!day || !day.dep || seen.has(JSON.stringify(day.dep))) continue;
    seen.add(JSON.stringify(day.dep));
    cases.push({ name: `service.json ${rid} ${k}`, dep: day.dep, deps: departures(day) });
  }
}
for (const c of cases) {
  c.segs = hourlyHeadways(c.deps);
  c.lines = c.segs.map((s) => headwayLine(s));
}
const out = { note: "web/js/core/schedule.js hourlyHeadways + headwayLine (12-hour clock) answers; made by web/tests/headways-golden.html", cases };
document.getElementById("result").textContent = JSON.stringify(out);
document.title = "TESTS pass=1 fail=0";
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>routesearch golden (running)</title>
</head>
<body>
<!-- Writes web/tests/routesearch-golden.json (the JavaScript's answers for the iOS Kit to match). Not part of the suite:
     run it with tools/gen_routesearch_golden.py after changing core/routesearch.js or the cases, then commit the file. -->
<pre id="out">running...</pre>
<script type="module">
import { buildRouteIndex, searchRoutes, routeWords, canon } from "../js/core/routesearch.js";
import { CASES, WORD_CASES } from "./routesearch-cases.js";

const get = (f) => fetch(`../data/${f}`, { cache: "no-store" }).then((r) => r.json());
const [routes, stops, routeStops] = await Promise.all([get("routes.json"), get("stops.json"), get("route_stops.json")]);
const ids = Object.keys(routes).sort((a, b) => String(routes[a].short || routes[a].long || a).localeCompare(String(routes[b].short || routes[b].long || b), undefined, { numeric: true }));
const items = ids.map((id) => {
  const seen = new Set(), names = [];
  for (const sid of routeStops[id] || []) { const n = stops[sid]?.name; if (n && !seen.has(n)) { seen.add(n); names.push(n); } }
  return { id, short: routes[id].short || "", long: routes[id].long || "", stops: names };
});
const index = buildRouteIndex(items);
const r4 = (x) => Math.round(x * 10000) / 10000;
const out = {
  note: "Generated by web/tests/gen-routesearch-golden.html (tools/gen_routesearch_golden.py) from web/js/core/routesearch.js on a frozen copy of the routes and their stop names. web/tests/core-routesearch.js and the iOS Kit RouteSearchTests.swift both check every case.",
  routes: items,
  words: WORD_CASES.map(([s, typing]) => ({ s, typing, words: routeWords(s, typing), canon: routeWords(s, typing).map(canon) })),
  cases: CASES.map((q) => ({ q, hits: searchRoutes(index, q).map((h) => [h.id, r4(h.score), h.stop ?? null]) })),
};
document.getElementById("out").textContent = JSON.stringify(out);
document.title = "routesearch golden done";
</script>
</body>
</html>
